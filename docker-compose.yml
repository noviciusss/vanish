version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: anon_chat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anon
      POSTGRES_PASSWORD: anon_password
      POSTGRES_DB: anon_chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: anon_chat_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
